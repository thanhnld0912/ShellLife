<!doctype html>
<html lang="vi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Xem Model Low-poly</title>
  <style>
    :root { --bg: #111514; --panel: #1a201e; --line: #2c3532; --text: #e6e2d6; --muted: #8f9a94; --accent: #ff3b30; }
    * { box-sizing: border-box; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, "Segoe UI", sans-serif; }
    #app { display: grid; grid-template-columns: 300px 1fr; height: 100%; }
    aside { background: var(--panel); border-right: 1px solid var(--line); overflow-y: auto; padding: 16px; }
    h1 { font-size: 16px; margin: 0 0 4px; }
    .sub { color: var(--muted); font-size: 12px; margin-bottom: 14px; }
    button.item { display: block; width: 100%; text-align: left; background: none; border: 1px solid transparent; color: var(--text); padding: 7px 10px; border-radius: 6px; cursor: pointer; font: inherit; }
    button.item:hover { background: #222a27; }
    button.item.on { border-color: var(--accent); background: #2a1f1e; }
    button.item small { color: var(--muted); float: right; }
    button.item.compare { border-color: var(--line); margin-bottom: 8px; font-weight: 600; }
    #clips button small { color: var(--muted); font-size: 11px; }
    #info { margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line); font-size: 13px; }
    #info b { display: block; font-size: 15px; margin-bottom: 4px; }
    #info .meta { color: var(--muted); margin-top: 6px; }
    .row { display: flex; gap: 6px; flex-wrap: wrap; margin: 12px 0 4px; }
    .row button { background: #222a27; border: 1px solid var(--line); color: var(--text); padding: 5px 9px; border-radius: 6px; cursor: pointer; font: inherit; font-size: 12px; }
    .row button.on { border-color: var(--accent); }
    #clips:empty { display: none; }
    #clips { margin: 10px 0 14px; padding: 10px; border: 1px solid var(--line); border-radius: 8px; }
    #clips .t { font-size: 12px; color: var(--muted); margin-bottom: 6px; }
    #clips button { display: block; width: 100%; text-align: left; margin: 3px 0; background: #222a27; border: 1px solid var(--line); color: var(--text); padding: 6px 9px; border-radius: 6px; cursor: pointer; font: inherit; font-size: 13px; }
    #clips button.on { border-color: var(--accent); background: #2a1f1e; }
    #clips label { display: flex; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); margin-top: 8px; }
    #clips input[type=range] { flex: 1; }
    main { position: relative; min-width: 0; }
    canvas { display: block; width: 100%; height: 100%; }
    #hint { position: absolute; left: 12px; bottom: 10px; color: var(--muted); font-size: 12px; pointer-events: none; }
    @media (max-width: 700px) { #app { grid-template-columns: 1fr; grid-template-rows: 45% 55%; } aside { border-right: 0; border-bottom: 1px solid var(--line); } }
  </style>
</head>
<body>
  <div id="app">
    <aside>
      <h1>Model low-poly · Hợp Đồng 30 Đêm</h1>
      <div class="sub">Tạo bằng <code>art/blender/tao_model_lowpoly.py</code></div>
      <div class="row">
        <button id="lightStudio" class="on">Ánh sáng xem</button>
        <button id="lightGame">Ánh sáng ca đêm</button>
        <button id="ps1">Bộ lọc PS1</button>
        <button id="scaleRef">Người 1,72 m</button>
      </div>
      <div id="clips"></div>
      <div id="list"></div>
      <div id="info"></div>
    </aside>
    <main>
      <canvas id="c"></canvas>
      <div id="hint">Kéo chuột để xoay · lăn để phóng to · chuột phải để dời</div>
    </main>
  </div>
  <script type="module" src="/src/viewer.ts"></script>
</body>
</html>
